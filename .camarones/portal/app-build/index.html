<html lang="en">

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="cam-mode" content="live">
  <title>Camarón</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="theme/tokens.css">
  <!-- The docs renderer's libraries (src/content/doc.js), served offline by the portal from vendor/. -->

<body>
  <!-- The shell (src/shell/Shell.jsx) renders the page here; the diagram zoom and the toast stay outside it. -->
  <div id="app"></div>
  <dialog id="zoomer" class="zoomer">
    <div class="zoom-tools">
      <button id="zoom-in" class="ghost icon" type="button" aria-label="zoom in">＋</button>
      <button id="zoom-out" class="ghost icon" type="button" aria-label="zoom out">－</button>
      <button id="zoom-fit" class="ghost icon" type="button" aria-label="fit">⤢</button>
      <button id="zoomer-close" class="ghost icon" type="button" aria-label="close">✕</button>
    </div>
    <div id="zoomer-body"></div>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
