# For servers: DOCS_IMAGE=<registry>/.../portal:latest docker compose -f .camarones/portal/compose.yml up -d --no-build
# (locally `camarones up` uses plain docker build + docker run, no compose needed)
services:
  docs-portal:
    build:
      context: ../.cache/portal-image
    image: ${DOCS_IMAGE:-camarones-docs-portal:local}
    ports:
      - "${PORT:-8080}:80"
    restart: unless-stopped
