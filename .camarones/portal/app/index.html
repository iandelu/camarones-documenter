<!doctype html>
<html lang="en">
<head>
  <!-- One portal: the React views (Pipeline, Ask…) and the docs views in public/legacy/ (plain scripts). -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="cam-mode" content="live">
  <title>Camarón</title>
  <link rel="icon" href="legacy/favicon.svg">
  <link rel="stylesheet" href="theme/tokens.css">
  <link rel="stylesheet" href="legacy/app.css">
  <script src="vendor/marked@15.0.12/lib/marked.umd.js"></script>
  <script src="vendor/dompurify@3.2.6/dist/purify.min.js"></script>
  <script src="vendor/mermaid@11.4.1/dist/mermaid.min.js"></script>
  <script src="vendor/@highlightjs/cdn-assets@11.11.1/highlight.min.js"></script>
</head>
<body>
  <!-- The shell (src/shell/Shell.jsx) renders the header, sidebar and view slots here. The dialogs below stay in the
       page: the plain scripts bind them when they load. -->
  <div id="app"></div>
  <dialog id="zoomer" class="zoomer">
    <div class="zoom-tools">
      <button id="zoom-in" class="ghost icon" type="button" aria-label="zoom in">＋</button>
      <button id="zoom-out" class="ghost icon" type="button" aria-label="zoom out">－</button>
      <button id="zoom-fit" class="ghost icon" type="button" aria-label="fit">⤢</button>
      <button id="zoomer-close" class="ghost icon" type="button" aria-label="close">✕</button>
    </div>
    <div id="zoomer-body"></div>
  </dialog>
  <div id="toast" class="toast" hidden></div>
  <script defer src="legacy/core.js"></script>
  <script defer src="legacy/app.js"></script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
