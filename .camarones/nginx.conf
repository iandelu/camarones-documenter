server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  # LikeC4 app uses client-side routing under /architecture/
  location /architecture/ { try_files $uri $uri/ /architecture/index.html; }
  # the portal is one page with #/ routes; unknown paths fall back to it
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(js|css|svg|woff2?|png|jpg)$ { expires 7d; add_header Cache-Control "public"; }
  location /api/ { add_header Cache-Control "no-cache"; }
}
