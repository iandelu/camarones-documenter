server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  # LikeC4 app uses client-side routing under /architecture/
  location /architecture/ { try_files $uri $uri/ /architecture/index.html; }
  location / { try_files $uri $uri/ $uri.html =404; }
  error_page 404 /404.html;
  location ~* \.(js|css|svg|woff2?|png|jpg)$ { expires 7d; add_header Cache-Control "public"; }
}
