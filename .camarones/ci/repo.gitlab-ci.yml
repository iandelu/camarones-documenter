# 🦐 Camarón — snippet for EACH microservice repo (GitLab).
# Add to the repo's .gitlab-ci.yml:   include: { project: '<group>/<umbrella>', file: '.camarones/ci/repo.gitlab-ci.yml' }
# (or copy these two jobs). Variables on the repo (or group):
#   ANTHROPIC_API_KEY (masked), OPENWIKI_GITLAB_TOKEN (masked: api + write_repository), DOCS_UMBRELLA_PROJECT (e.g. acme/acme-docs)

openwiki:update:
  image: node:22
  stage: deploy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
  variables:
    OPENWIKI_PROVIDER: anthropic
    OPENWIKI_MODEL_ID: claude-sonnet-5
    OPENWIKI_TELEMETRY_DISABLED: "1"
  before_script:
    - npm install --global openwiki@0.5.2 >/dev/null
    - git config user.name "docs-bot" && git config user.email "docs-bot@${CI_SERVER_HOST}"
  script:
    - openwiki code --update --print
    - |
      if git diff --quiet -- openwiki AGENTS.md CLAUDE.md && [ -z "$(git ls-files --others --exclude-standard openwiki)" ]; then
        echo "OpenWiki is already up to date."; exit 0
      fi
    - BRANCH="openwiki/update-${CI_PIPELINE_ID}"
    - git checkout -b "$BRANCH" && git add openwiki AGENTS.md CLAUDE.md && git commit -m "docs: update OpenWiki"
    - git push "https://oauth2:${OPENWIKI_GITLAB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "$BRANCH"
    - |
      curl --fail -sS --request POST --header "PRIVATE-TOKEN: ${OPENWIKI_GITLAB_TOKEN}" \
        --form "source_branch=${BRANCH}" --form "target_branch=${CI_DEFAULT_BRANCH}" \
        --form "title=docs: update OpenWiki" --form "remove_source_branch=true" \
        --form "description=Automated OpenWiki update. Pages stay AI drafts until confirmed in the umbrella repo." \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests"

# After every merge to the default branch, ask the umbrella repo to refresh project-level docs.
docs:notify-umbrella:
  stage: .post
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $DOCS_UMBRELLA_PROJECT'
  trigger:
    project: $DOCS_UMBRELLA_PROJECT   # fire-and-forget: does not block this pipeline
