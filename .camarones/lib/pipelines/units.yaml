# Every unit type the kit knows. phase orders the plan; runner says who does it (agent session or wizard step);
# title is what people see ({repo} / {slug} filled in), and what plan.yaml keeps; title_es is how it reads in Spanish
# (plan.title localizes at read time, never in plan.yaml); playbook is the PLAYBOOK.md section the agent follows.
# tier (default agentic-heavy) picks the runner through the routing table: bounded work can go to a local model.
# isolation: worktree runs the unit in its own copy of cam-docs when units run in parallel (default: none).
quick-overview:      {phase: 2, runner: agent,  playbook: quick-overview,      title: "First overview: purpose, run instructions, one flow and sources", title_es: "Primer vistazo: para qué sirve, cómo se arranca, un flujo y sus fuentes"}
setup:               {phase: 0, runner: wizard, playbook: setup,               title: "Environment ready (tools, repos, agent wiring)", title_es: "Entorno listo (herramientas, repos y agentes conectados)"}
discovery:           {phase: 1, runner: agent,  playbook: discovery,           isolation: worktree, title: "Discovery of {repo}", title_es: "Descubrimiento de {repo}"}
discovery-cross:     {phase: 1, runner: agent,  playbook: discovery-cross,     title: "Cross-repo correlation (integrations, shared DBs, candidate flows)", title_es: "Cruce entre repos (integraciones, BD compartidas, flujos candidatos)"}
questionnaire:       {phase: 2, runner: agent,  playbook: questionnaire,       title: "Team questionnaire: inferred answers and options to share with the team", title_es: "Cuestionario del equipo: respuestas deducidas y opciones para compartir con el equipo"}
answers:             {phase: 2, runner: wizard, playbook: answers,             title: "Team answers: share the questionnaire and import the answers", title_es: "Respuestas del equipo: comparte el cuestionario e importa las respuestas"}
interview-context:   {phase: 2, runner: agent,  playbook: interview,           title: "Interview 1: bounded contexts, external actors, environments", title_es: "Entrevista 1: contextos delimitados, actores externos, entornos"}
interview-language:  {phase: 2, runner: agent,  playbook: interview,           title: "Interview 2: DDD glossary, SLAs / NFRs", title_es: "Entrevista 2: glosario DDD, SLA y requisitos no funcionales"}
interview-history:   {phase: 2, runner: agent,  playbook: interview,           title: "Interview 3: historical decisions, known debt, validate integrations/flows/data", title_es: "Entrevista 3: decisiones pasadas, deuda conocida, validar integraciones, flujos y datos"}
repo-brief:          {phase: 3, runner: agent,  playbook: repo-brief,          isolation: worktree, title: "{repo}: README + AGENTS.md/CLAUDE.md (stack) + C4 components + OpenWiki brief", title_es: "{repo}: README + AGENTS.md/CLAUDE.md (stack) + componentes C4 + resumen para OpenWiki"}
repo-wiki:           {phase: 3, runner: agent,  playbook: repo-wiki,           title: "{repo}: OpenWiki repository wiki", title_es: "{repo}: wiki del repositorio en OpenWiki"}
arch-system:         {phase: 4, runner: agent,  playbook: arch-system,         title: "C4 system: context + containers views", title_es: "Sistema en C4: vistas de contexto y de contenedores"}
domain:              {phase: 4, runner: agent,  playbook: domain,              title: "Domain: bounded contexts, context map, glossary, actors", title_es: "Dominio: contextos delimitados, mapa de contextos, glosario, actores"}
data:                {phase: 4, runner: agent,  playbook: data,                title: "Data models: ERDs, ownership, shared DBs", title_es: "Modelos de datos: diagramas ER, quién es dueño de cada dato, BD compartidas"}
deployment:          {phase: 4, runner: agent,  playbook: deployment,          title: "Deployment: environments + C4 deployment views", title_es: "Despliegue: entornos + vistas de despliegue en C4"}
decisions-quality:   {phase: 4, runner: agent,  playbook: decisions-quality,   title: "ADRs, SLAs, tech debt", title_es: "ADR, SLA, deuda técnica"}
security-review:     {phase: 5, runner: agent,  playbook: security-review,     title: "[beta] Security review: threats and vulnerabilities", title_es: "[beta] Revisión de seguridad: amenazas y vulnerabilidades"}
architecture-review: {phase: 5, runner: agent,  playbook: architecture-review, title: "[beta] Architecture review: coupling, duplication, tech debt", title_es: "[beta] Revisión de arquitectura: acoplamiento, duplicación, deuda técnica"}
flows-catalog:       {phase: 5, runner: agent,  playbook: flows-catalog,       title: "Business flows catalog (propose, validate, create flow units)", title_es: "Catálogo de flujos de negocio (proponer, validar, crear las unidades de flujo)"}
flow:                {phase: 5, runner: agent,  playbook: flow,                isolation: worktree, title: "Flow: {slug}", title_es: "Flujo: {slug}"}
diagrams:            {phase: 5, runner: agent,  playbook: diagrams,            title: "Diagrams: sequences, lifecycles (state), data and context maps where pages lack them", title_es: "Diagramas: secuencias, ciclos de vida (estados), datos y mapas de contexto donde falten"}
i18n:                {phase: 6, runner: agent,  playbook: i18n,                tier: bounded, title: "Spanish translations + index", title_es: "Traducciones al español + índice"}
portal:              {phase: 7, runner: wizard, playbook: portal,              title: "Build and run the portal", title_es: "Construir y abrir el portal"}
ci:                  {phase: 7, runner: wizard, playbook: ci,                  title: "CI pipelines (umbrella + per-repo snippets)", title_es: "Pipelines de CI (el general + fragmentos por repo)"}
confirm:             {phase: 7, runner: wizard, playbook: confirm,             title: "Human review: confirm pages", title_es: "Revisión humana: confirmar páginas"}
handover:            {phase: 7, runner: agent,  playbook: handover,            title: "Handover: summary, commits on branches, next steps", title_es: "Traspaso: resumen, commits en ramas, siguientes pasos"}
review-fixes:        {phase: 7, runner: agent,  playbook: review-fixes,        title: "Apply human review feedback", title_es: "Aplicar los comentarios de la revisión humana"}
doc-fixes:           {phase: 7, runner: agent,  playbook: doc-fixes,           title: "Fix documentation problems (check errors, orphans, re-confirmations, translations)", title_es: "Corregir problemas de la documentación (errores del check, páginas huérfanas, reconfirmaciones, traducciones)"}
refresh-docs:        {phase: 7, runner: agent,  playbook: refresh-docs,        title: "Refresh the pages whose code changed", title_es: "Poner al día las páginas cuyo código cambió"}
eval-questions:      {phase: 7, runner: agent,  playbook: eval-questions,      tier: bounded, title: "Golden questions: draft what the docs must answer (a person confirms them)", title_es: "Preguntas de oro: redactar lo que la documentación debe responder (una persona las confirma)"}
integrate:           {phase: 7, runner: agent,  playbook: integrate,           title: "Integrate {slug}: resolve it against the main docs", title_es: "Integrar {slug}: resolver el choque con la documentación principal"}
