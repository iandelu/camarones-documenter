# Development only: the kit itself runs as a uv inline script (.camarones/camarones.py) and ignores this file.
[project]
name = "camarones-documenter-dev"
version = "0"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
# same runtime dependencies as the inline header of .camarones/camarones.py, plus pytest
dev = ["pytest>=8", "pyyaml>=6", "rich>=13", "questionary>=2", "keyring>=25"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: clones real repos from GitHub (network); run with -m e2e"]
addopts = "-m 'not e2e' -p no:cacheprovider"
