name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -n auto

  # The portal (React views + the docs views) is built here and committed, so users never need Node for it.
  portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .camarones/portal/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: the committed build matches its source
        working-directory: .
        run: |
          changes="$(git status --porcelain -- .camarones/portal/app-build)"
          if [ -n "$changes" ]; then
            echo "Rebuild the portal and commit it: cd .camarones/portal/app && npm ci && npm run build"
            echo "$changes"
            exit 1
          fi

  # The desktop app's own UI (desktop/renderer), built and committed like the portal.
  renderer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .camarones/desktop/renderer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: the committed build matches its source
        working-directory: .
        run: |
          changes="$(git status --porcelain -- .camarones/desktop/renderer-build)"
          if [ -n "$changes" ]; then
            echo "Rebuild the app's UI and commit it: cd .camarones/desktop/renderer && npm ci && npm run build"
            echo "$changes"
            exit 1
          fi

  # The desktop app's main process (`camaron app`): its pure helpers on every OS, no Electron download needed.
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .camarones/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "test/*.test.cjs"
